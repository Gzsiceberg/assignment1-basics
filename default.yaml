experiment:
  name: ""
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  batch_size: 16
  steps: 1000
  checkpoints_interval: 1
  checkpoints_path: "checkpoints"

data:
  train_data: "data/TinyStoriesV2-GPT4-train-bpe-merged.npy"
  valid_data: "data/TinyStoriesV2-GPT4-valid-bpe-merged.npy"

model:
  vocab_size: 10000
  num_layers: 2
  d_model: 128
  num_heads: 8
  d_ff: 512
  max_seq_len: 64
  theta: 100000.0
  ffn_type: "silu"

optimizer:
  learning_rate: 0.001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  grad_clip: 0